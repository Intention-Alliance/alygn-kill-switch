# Admin UI - Separate Server Block on Port 8443
# Place this in /etc/nginx/sites-available/admin-ui.conf
# Then: sudo ln -s /etc/nginx/sites-available/admin-ui.conf /etc/nginx/sites-enabled/

server {
    listen 8443 ssl;
    server_name andlersrv.tail62d797.ts.net;

    # SSL Configuration
    ssl_certificate /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
    ssl_certificate_key /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Admin UI - SPA
    location / {
        root /var/www;
        index admin/index.html;
        try_files $uri $uri/ /admin/index.html;

        # Security Headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://andlersrv.tail62d797.ts.net:8443; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # Static Assets
    location ~* ^/admin/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API Proxy
    location /api/ {
        set $auth_token $http_authorization;
        if ($http_cookie ~* "admin_token=([^;]+)") {
            set $auth_token "Bearer $1";
        }

        if ($auth_token = "") {
            return 401;
        }

        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $auth_token;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
