# Phase 0 - Complete Infrastructure Stack
# Single authoritative compose file — run from /phase0/
#
# Usage:  docker compose up -d
# Teardown: docker compose down
#
# Includes: Redis Cluster (3 nodes), Kill Switch API, OTel Collector, Jaeger
x-redis-common: &redis-common
  image: redis:7.4-alpine
  restart: unless-stopped
  networks:
    - phase0-net
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "6379", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  # ─── Redis Cluster ────────────────────────────────────────────────
  redis-node-1:
    <<: *redis-common
    container_name: redis-node-1
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis-1-data:/data
      - ./redis/conf/node-1.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-node-2:
    <<: *redis-common
    container_name: redis-node-2
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - redis-2-data:/data
      - ./redis/conf/node-2.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-node-3:
    <<: *redis-common
    container_name: redis-node-3
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - redis-3-data:/data
      - ./redis/conf/node-3.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-cluster-init:
    image: redis:7.4-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-node-1: { condition: service_healthy }
      redis-node-2: { condition: service_healthy }
      redis-node-3: { condition: service_healthy }
    networks:
      - phase0-net
    restart: "no"
    entrypoint: []
    command: >
      sh -c "sleep 5 && redis-cli --cluster create
        redis-node-1:6379 redis-node-2:6379 redis-node-3:6379
        --cluster-replicas 0 --cluster-yes &&
        echo 'Cluster created'"

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    networks:
      - phase0-net
    environment:
      REDIS_ADDR: "redis-node-1:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      - redis-node-1

  # ─── Kill Switch API ─────────────────────────────────────────────
  kill-switch-api:
    build:
      context: .
      dockerfile: kill-switch/Dockerfile
    container_name: kill-switch-api
    restart: unless-stopped
    ports:
      - "3000:3000"  # Internal access via nginx (/api/ → :3000/v1/)
    environment:
      - NODE_ENV=production
      - KILL_SWITCH_AUTH_TOKEN=${KILL_SWITCH_AUTH_TOKEN}
      - KILL_SWITCH_API_KEY=${KILL_SWITCH_API_KEY}
      - REDIS_URLS=redis://redis-node-1:6379,redis://redis-node-2:6379,redis://redis-node-3:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=kill-switch-api
    networks:
      - phase0-net
    depends_on:
      redis-node-1: { condition: service_healthy }
      redis-node-2: { condition: service_healthy }
      redis-node-3: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/kill-switch/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Tracing ──────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.69.0
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - phase0-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # Collector metrics
    volumes:
      - ./tracing/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    networks:
      - phase0-net

networks:
  phase0-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
