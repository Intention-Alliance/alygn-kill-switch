# Admin UI Nginx Configuration
# Place this in /etc/nginx/sites-available/admin-ui.conf
# Then: ln -s /etc/nginx/sites-available/admin-ui.conf /etc/nginx/sites-enabled/

server {
    listen 443 ssl http2;
    server_name andlersrv.tail62d797.ts.net;

    # SSL Configuration
    ssl_certificate /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
    ssl_certificate_key /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # IP Allowlist - Only allow trusted IPs
    set $allowed_ip 0;
    if ($remote_addr ~ ^(100\.66\.199\.80|192\.168\.1\.11|127\.0\.0\.1)$) {
        set $allowed_ip 1;
    }

    # Admin UI location block
    location /admin/ {
        # IP restriction
        if ($allowed_ip = 0) {
            return 403;
        }

        # Serve static files
        root /var/www/admin-ui;
        index index.html;

        # Try to serve file, fall back to index.html for SPA routing
        try_files $uri $uri/ /admin/index.html;

        # Security Headers
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://andlersrv.tail62d797.ts.net:11435; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Disable caching for index.html
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # API Proxy - Forward to backend
    location /admin/api/ {
        # IP restriction
        if ($allowed_ip = 0) {
            return 403;
        }

        # Token validation - check Authorization header or cookie
        set $auth_token $http_authorization;
        if ($http_cookie ~* "admin_token=([^;]+)") {
            set $auth_token "Bearer $1";
        }

        if ($auth_token = "") {
            return 401;
        }

        # Proxy to backend
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $auth_token;

        # Security headers for API responses
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # WebSocket support for real-time features
    location /admin/ws/ {
        # IP restriction
        if ($allowed_ip = 0) {
            return 403;
        }

        proxy_pass http://127.0.0.1:3000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Login page (public, no IP restriction for login)
    location = /login {
        root /var/www/admin-ui;
        index index.html;
        try_files $uri $uri/ /login/index.html;

        # Security headers (relaxed frame-ancestors for login)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name andlersrv.tail62d797.ts.net;
    return 301 https://$server_name$request_uri;
}