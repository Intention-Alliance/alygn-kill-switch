# COMPLETE NGINX CONFIG - MATCHES VITE BUILD (base: '/')
# Replace /etc/nginx/nginx.conf with this

user http;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Ollama Cluster Upstream
    upstream ollama_cluster {
        server 192.168.1.117:11434 max_fails=3 fail_timeout=30s max_conns=3;
        server 127.0.0.1:11434 backup;
    }

    # Kill Switch API Upstream
    upstream kill_switch_api {
        server 127.0.0.1:3000;
    }

    # ============================================
    # SERVER BLOCK 1: Ollama Proxy (Port 11435)
    # ============================================
    server {
        listen 11435 ssl;
        server_name andlersrv.tail62d797.ts.net;

        ssl_certificate /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
        ssl_certificate_key /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # IP Allowlist for Ollama
        allow 100.66.199.80;
        allow 192.168.1.11;
        allow 127.0.0.1;
        deny all;

        # Ollama Proxy
        location / {
            proxy_pass http://ollama_cluster;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5400s;
            proxy_send_timeout 5400s;
            proxy_connect_timeout 5s;
            proxy_socket_keepalive on;
            keepalive_timeout 600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            chunked_transfer_encoding on;
        }
    }

    # ============================================
    # SERVER BLOCK 2: Admin UI (Port 8443)
    # ============================================
    server {
        listen 8443 ssl;
        server_name andlersrv.tail62d797.ts.net;

        ssl_certificate /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
        ssl_certificate_key /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Admin UI - SPA (base: '/')
        # Serves index.html for all routes
        location / {
            root /var/www/admin;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Security Headers
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://andlersrv.tail62d797.ts.net:8443 http://127.0.0.1:3000; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        }

        # Static Assets - Matches Vite build output
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /var/www/admin;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # API Proxy - Kill Switch Backend
        location /api/ {
            set $auth_token $http_authorization;
            if ($http_cookie ~* "admin_token=([^;]+)") {
                set $auth_token "Bearer $1";
            }

            if ($auth_token = "") {
                return 401;
            }

            proxy_pass http://kill_switch_api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $auth_token;

            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Auth API Proxy - Allow login without auth
        location /v1/auth/ {
            proxy_pass http://kill_switch_api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow POST to login without authentication
            proxy_pass_request_body on;
            proxy_set_header Content-Type $content_type;
        }
    }

    # ============================================
    # SERVER BLOCK 3: HTTP Redirect
    # ============================================
    server {
        listen 80;
        server_name andlersrv.tail62d797.ts.net;
        return 301 https://$server_name$request_uri;
    }
}
