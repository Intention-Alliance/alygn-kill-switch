# Redis Cluster - Phase 0 Shared Infrastructure
# ADR-112, ADR-113, ADR-116, ADR-117
#
# Dev: 3-node cluster (single host, different ports)
# Prod: 3+ AZs, 6 nodes minimum (3 masters + 3 replicas)
version: "3.8"

x-redis-common: &redis-common
  image: redis:7.4-alpine
  restart: unless-stopped
  networks:
    - phase0-net
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "6379", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  redis-node-1:
    <<: *redis-common
    container_name: redis-node-1
    ports:
      - "6379:6379"
      - "16379:16379"
    volumes:
      - redis-1-data:/data
      - ./conf/node-1.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-node-2:
    <<: *redis-common
    container_name: redis-node-2
    ports:
      - "6380:6379"
      - "16380:16379"
    volumes:
      - redis-2-data:/data
      - ./conf/node-2.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  redis-node-3:
    <<: *redis-common
    container_name: redis-node-3
    ports:
      - "6381:6379"
      - "16381:16379"
    volumes:
      - redis-3-data:/data
      - ./conf/node-3.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  # Cluster init - runs once to create the cluster
  redis-cluster-init:
    image: redis:7.4-alpine
    container_name: redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    networks:
      - phase0-net
    restart: "no"
    entrypoint: []
    command: >
      sh -c "echo 'Waiting for nodes to be ready...' && sleep 5 && redis-cli --cluster create redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 --cluster-replicas 0 --cluster-yes && echo 'Cluster created successfully'"

  # Redis exporter for Prometheus metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    ports:
      - "9121:9121"
    networks:
      - phase0-net
    environment:
      REDIS_ADDR: "redis-node-1:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      - redis-node-1

networks:
  phase0-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data: