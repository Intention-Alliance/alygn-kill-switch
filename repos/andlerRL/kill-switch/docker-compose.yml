version: '3.8'

services:
  kill-switch-api:
    image: oven/bun:1.3-debian
    container_name: kill-switch-api
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - ./data:/app/data  # Persist SQLite database
    working_dir: /app
    command: sh -c "bun install && bun run src/index.ts"
