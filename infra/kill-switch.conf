# ALYGN Kill Switch - Nginx Site Config
# Frontend: Next.js (port 3001) - SSR/SSG
# Backend API: Bun + Elysia (port 3000) - direct proxy, bypasses Next.js
# WebSocket: Bun (port 3000) - direct proxy, bypasses Next.js
#
# Listens on 100.66.199.80:8443 (Tailscale IP only) — INTERNAL access only.
# Public webhook traffic goes through webhook.andler.dev:8443 (separate vhost).
#
# Note: upstream kill_switch_api is defined in /etc/nginx/nginx.conf
#       upstream web_regulator is defined locally (only used here)
#
# APPLIED FIX (2026-08-26, Rokthar):
#   Added `location /mcp` so https://andlersrv.tail62d797.ts.net:8443/mcp
#   proxies to the MCP server on 127.0.0.1:3010 (previously fell through to
#   the Next.js `location /` and returned the dashboard 404 page).
#   Auth is enforced by the MCP server itself via X-Webhook-Key (401 if absent).

upstream web_regulator {
    server 127.0.0.1:3001;
}

server {
    listen      100.66.199.80:8443 ssl;
    server_name andlersrv.tail62d797.ts.net;

    ssl_certificate             /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
    ssl_certificate_key         /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_timeout         10m;

    access_log /var/log/nginx/alygn-kill-switch-access.log;
    error_log /var/log/nginx/alygn-kill-switch-error.log;

    # ─── WebSocket — MUST come before /v1/ and / ───────────────
    location /ws {
        proxy_pass http://kill_switch_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── OpenClaw Webhook Health — public, no API key ──────────
    location = /webhook/health {
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── OpenClaw Webhook Proxy — API key auth ─────────────────
    location /webhook/ {
        set $expected_key "wk_kvlGrfkWJIinquVRyeCgrXsOTxBpEctVQNWwwAAYVxM";
        if ($http_x_webhook_key != $expected_key) {
            return 401 '{"error":{"code":"UNAUTHORIZED","message":"Missing or invalid X-Webhook-Key header"}}';
            add_header Content-Type "application/json" always;
        }

        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Webhook-Key $http_x_webhook_key;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── MCP Server (wobblus-mcp-server on 3010) — X-Webhook-Key auth enforced by the MCP server ─
    location /mcp {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── Auth API — direct backend proxy with cookie passthrough ─
    location /v1/auth/ {
        proxy_pass http://kill_switch_api/v1/auth/;
        proxy_pass_request_body on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Set-Cookie;
    }

    # ─── /api/* — direct backend proxy (bypasses Next.js rewrites) ─
    location /api/ {
        proxy_pass http://kill_switch_api/v1/;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ─── /v1/* — direct backend proxy ────────────────────────────
    location /v1/ {
        proxy_pass http://kill_switch_api/v1/;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # ─── Next.js Frontend — everything else (SSR, static, /api/* rewrites) ─
    location / {
        proxy_pass http://web_regulator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ─── Health Check ───────────────────────────────────────────
    location = /health {
        proxy_pass http://kill_switch_api/v1/kill-switch/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
