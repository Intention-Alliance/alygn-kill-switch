# OTel Collector + Jaeger - Phase 0 Tracing Infrastructure
# ADR-115: Distributed Tracing
version: "3.8"

services:
  # Jaeger backend (all-in-one for dev)
  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger HTTP collector (legacy)
      - "14250:14250"   # Jaeger gRPC collector (legacy)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - phase0-net

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "8888:8888"     # Collector metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    networks:
      - phase0-net

networks:
  phase0-net:
    external: true