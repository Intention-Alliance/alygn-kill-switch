# ALYGN Kill Switch - Nginx Site Config
# Frontend: Next.js (port 3001) - SSR/SSG
# Backend API: Bun + Elysia (port 3000) - proxied through Next.js rewrites

upstream web_regulator {
    server 127.0.0.1:3001;
}

server {
    listen      8443 ssl;
    server_name andlersrv.tail62d797.ts.net;

    ssl_certificate             /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
    ssl_certificate_key         /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_timeout         10m;

    # Access logs
    access_log /var/log/nginx/alygn-kill-switch-access.log;
    error_log /var/log/nginx/alygn-kill-switch-error.log;

    # ─── Next.js Frontend Proxy ─────────────────────────────────
    # Next.js handles SSR, static files, and API rewrites internally
    location / {
        proxy_pass http://web_regulator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        
        # Security headers (Next.js also sets these, but nginx enforces them)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ─── Direct Backend API Access (optional, for internal services) ─────────────────────────────────
    # Next.js already proxies /api/* → http://localhost:3000/v1/*
    # This is only needed if you want direct backend access
    #
    # location /v1/ {
    #     proxy_pass http://kill_switch_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 90s;
    # }

    # ─── Health Check Endpoint ─────────────────────────────────
    location = /health {
        proxy_pass http://web_regulator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
