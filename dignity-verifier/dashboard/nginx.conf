# ============================================================
# Dignity Verifier Dashboard — Nginx Site Config
# ============================================================
# Super-admin dashboard for the Dignity Verifier Training Framework.
#
# Listens on the Tailscale IP (100.66.199.80:8443) ONLY — INTERNAL access
# only. Denies all non-Tailscale IPs. SSL via the existing Tailscale cert.
# Proxies to the dashboard container on 127.0.0.1:3002.
#
# Install: symlink into /etc/nginx/sites-enabled/ and reload nginx.
#   sudo ln -sf /etc/nginx/sites-available/dignity-verifier.conf \
#               /etc/nginx/sites-enabled/dignity-verifier.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: The Tailscale IP (100.66.199.80) is the host's mesh address. The
# dashboard container publishes 127.0.0.1:3002 on the host, so nginx
# proxies to the host loopback.
# ============================================================

upstream dignity_verifier {
    server 127.0.0.1:3002;
}

server {
    listen      100.66.199.80:8443 ssl;
    server_name andlersrv.tail62d797.ts.net;

    ssl_certificate             /etc/ssl/private/andlersrv.tail62d797.ts.net.crt;
    ssl_certificate_key         /etc/ssl/private/andlersrv.tail62d797.ts.net.key;
    ssl_protocols               TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache           shared:SSL:10m;
    ssl_session_timeout         10m;

    access_log /var/log/nginx/alygn-dignity-verifier-access.log;
    error_log /var/log/nginx/alygn-dignity-verifier-error.log;

    # ─── Tailscale-only access control ────────────────────────
    # Deny everything not from the Tailscale CGNAT range (100.64.0.0/10).
    # This is the network-edge enforcement; the app re-verifies the client
    # IP as defense-in-depth (src/lib/auth.ts isTailscaleIP).
    allow 100.64.0.0/10;
    deny  all;

    # ─── Health Check ──────────────────────────────────────────
    location = /health {
        proxy_pass http://dignity_verifier/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ─── Auth API — cookie passthrough ───────────────────────
    location /api/auth/ {
        proxy_pass http://dignity_verifier/api/auth/;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass_header Set-Cookie;
    }

    # ─── Next.js Frontend — everything else ──────────────────
    location / {
        proxy_pass http://dignity_verifier;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }
}
