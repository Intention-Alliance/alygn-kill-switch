version: '3.8'
services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # UI
      - "14268:14268" # Collector
      - "14250:14250" # gRPC
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=localhost:9411
    networks:
      - tracing-net

networks:
  tracing-net:
    driver: bridge
