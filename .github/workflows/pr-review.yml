name: PR Review Gate

# Ported from AndlerRL/andler-landing (.github/workflows/pr-review.yml), which
# is the working reference for the Wobblus PR-review MCP flow.
#
# Two adaptations for this repo:
#   1. Branches are [main, develop] — this repo's default is `develop`.
#   2. The landing copy's `check:env --strict` step is landing-specific
#      (NEXT_PUBLIC_SITE_URL, YOUTUBE_*, TWITCH_*, X_*). This repo has no such
#      script, so that step is omitted rather than ported as a no-op.
#
# The dispatch job posts a signed `pr-review.request` to the openclaw-webhook
# fabric, which routes it to the pr-review-bridge handler and posts the
# synthesized review back on the PR.

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# The review-assignment job labels the PR and posts the dispatch note.
# Without this block GITHUB_TOKEN is read-only on public repos, and those
# steps fail with 403 "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint
        continue-on-error: false

      - name: Run TypeScript Check
        run: bun run type-check
        continue-on-error: false

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Tests
        run: bun run test
        continue-on-error: false
        env:
          REDIS_URL: redis://localhost:6379

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  review-assignment:
    name: Dispatch Team Review (Wobblus MCP)
    runs-on: ubuntu-latest
    # Deliberately NOT gated on lint/test/build: the review dispatch is an
    # independent signal and must fire even while code-quality jobs are red
    # (e.g. the repo-wide bun install breakage from the db-schema removal).
    # The reviewer sees the diff regardless of CI state; merge-requirements
    # below still enforces the full gate before anything merges.
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch PR Review to Wobblus MCP
        env:
          # This repo's own keypair (issuer `github-actions-kill-switch`),
          # registered at
          #   ~/.openclaw/secrets/trusted-public-keys/github-actions-kill-switch.pem
          # Deliberately NOT the landing repo's key — the webhook resolves the
          # issuer to a key file, so each repo carries its own.
          GH_ACTIONS_PRIVATE_KEY: ${{ secrets.GH_ACTIONS_PRIVATE_KEY }}
          WEBHOOK_X_KEY: ${{ secrets.WEBHOOK_X_KEY }}
          WEBHOOK_ISSUER: github-actions-kill-switch
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_DIFF_URL: ${{ github.event.pull_request.diff_url }}
        run: node .github/scripts/pr-review-dispatch.mjs

      - name: Add Review Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Tolerant: a missing label must not fail the review dispatch.
            // The landing copy assumes these labels exist; this repo may not
            // have them yet, so create-on-miss instead of hard-failing.
            const wanted = ['phase-5', 'review-required'];
            for (const label of wanted) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: [label],
                });
              } catch (err) {
                console.log(`[labels] could not add "${label}": ${err.message}`);
              }
            }

      - name: Note Team Review Dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🔍 Team Review Dispatched ${{github.action_status}}

            **Wobblus MCP** (openclaw-webhook) has been notified. Nikaya 🔍 (reviewer) will review this PR and post a synthesized report — issues mapped by file, coderabbitai co-review, and next steps — directly on this PR.

            _Ported from the ${{github.repository}} PR Review Gate at ${{vars.GITHUB_REF_NAME}}._`
            });

  merge-requirements:
    name: Merge Requirements Check
    runs-on: ubuntu-latest
    needs: [test, build, review-assignment]
    if: github.event.pull_request.draft == false

    steps:
      - name: Check Approval Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });

            const approved = reviews.some(review => review.state === 'APPROVED');
            const changesRequested = reviews.some(review => review.state === 'CHANGES_REQUESTED');

            if (changesRequested) {
              console.log('❌ Changes requested - merge blocked');
              process.exit(1);
            }

            if (!approved) {
              console.log('⏳ Awaiting approval - at least 1 approver required');
              // Don't fail yet, allow time for review
            } else {
              console.log('✅ Approval requirement met');
            }

      - name: Check CI Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            const failedChecks = checks.check_runs.filter(check =>
              check.conclusion === 'failure' || check.conclusion === 'cancelled'
            );

            if (failedChecks.length > 0) {
              console.log('❌ CI checks failed - merge blocked');
              process.exit(1);
            }

            console.log('✅ All CI checks passed');
