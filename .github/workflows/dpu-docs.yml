name: DPU Docs Validation

# Docs-only / plan-only workflow for the Phase 6 DPU port (ADR-142).
# Validates that the DPU planning artifacts are present and well-formed.
# No runtime code, no server config, no manual SQL. Kept green.

on:
  push:
    branches: [main]
    paths:
      - 'docs/alygn-killswitch/dpu/**'
      - 'docs/architecture/ADR-142-dpu-native-os.md'
  pull_request:
    branches: [main]
    paths:
      - 'docs/alygn-killswitch/dpu/**'
      - 'docs/architecture/ADR-142-dpu-native-os.md'

jobs:
  validate-dpu-docs:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Verify required DPU planning artifacts exist
        run: |
          set -euo pipefail
          for f in \
            docs/architecture/ADR-142-dpu-native-os.md \
            docs/alygn-killswitch/dpu/README.md \
            docs/alygn-killswitch/dpu/architecture.md \
            docs/alygn-killswitch/dpu/hardware-requirements.md \
            docs/alygn-killswitch/dpu/deployment-playbook.md \
            docs/alygn-killswitch/dpu/hardware-funding-checklist.md
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Verify ADR-142 references the DPU directory
        run: |
          set -euo pipefail
          grep -q "docs/alygn-killswitch/dpu" \
            docs/architecture/ADR-142-dpu-native-os.md \
            || { echo "ADR-142 must reference docs/alygn-killswitch/dpu"; exit 1; }
          echo "OK: ADR-142 references DPU directory"

      - name: Verify architecture diagram is present (ASCII)
        run: |
          set -euo pipefail
          grep -q "BlueField" docs/alygn-killswitch/dpu/architecture.md \
            || { echo "architecture.md must reference BlueField"; exit 1; }
          grep -q "eBPF" docs/alygn-killswitch/dpu/architecture.md \
            || { echo "architecture.md must reference eBPF"; exit 1; }
          echo "OK: architecture diagram present"

      - name: Verify hardware-funding checklist has a budget estimate
        run: |
          set -euo pipefail
          grep -q "Budget Estimate" docs/alygn-killswitch/dpu/hardware-funding-checklist.md \
            || { echo "hardware-funding-checklist.md must have a Budget Estimate"; exit 1; }
          echo "OK: budget estimate present"

      - name: Verify no runtime code / server config in the DPU docs
        run: |
          set -euo pipefail
          # The deployment playbook is a skeleton (planning reference), not
          # executable automation. Confirm it is marked as such.
          grep -q "planning skeleton" docs/alygn-killswitch/dpu/deployment-playbook.md \
            || { echo "deployment-playbook.md must be marked as a planning skeleton"; exit 1; }
          echo "OK: deployment playbook is a planning skeleton (no runtime code)"
