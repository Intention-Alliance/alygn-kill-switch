version: '3.8'

services:
  # ============================================
  # Telemetry Handler (C++)
  # ============================================
  telemetry-handler:
    build:
      context: ./apps/server-telemetry-handler
      dockerfile: Dockerfile
    container_name: align-telemetry-handler
    restart: unless-stopped
    environment:
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - DPU_ID=${DPU_ID:-dpu-node-001}
      - DPU_SLUG=${DPU_SLUG:-austin-primary}
      - BATCH_SIZE=${BATCH_SIZE:-50}
      - FLUSH_INTERVAL_MS=${FLUSH_INTERVAL_MS:-3000}
      - ENABLE_ZKP=${ENABLE_ZKP:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_DEBUG=${ENABLE_DEBUG:-false}
    networks:
      - align-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # depends_on:
    #   - slashing-engine
    #   - rdma-monitor
  
  # ============================================
  # Kill Switch API (Bun + Elysia + SQLite)
  # ============================================
  kill-switch:
    build:
      context: .
      dockerfile: apps/server-kill-switch/Dockerfile
    container_name: alygn-kill-switch
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - kill-switch-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - KILL_SWITCH_ENV=${KILL_SWITCH_ENV:-production}
      - KILL_SWITCH_PORT=3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - KILL_SWITCH_AUTH_TOKEN=${KILL_SWITCH_AUTH_TOKEN:?KILL_SWITCH_AUTH_TOKEN required}
      - KILL_SWITCH_API_KEY=${KILL_SWITCH_API_KEY:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@alygn.com}
      - REDIS_URLS=${REDIS_URLS:-redis://redis:6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DATA_DIR=/app/data
      - LOG_LEVEL=${LOG_LEVEL:-info}
    extra_hosts:
      - "redis:host-gateway"
      - "otel-collector:host-gateway"
    networks:
      - align-network
      - phase0-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # RDMA Monitor
  # ============================================
  # rdma-monitor:
  #   build:
  #     context: ./apps/server-rdma-monitor
  #     dockerfile: ./apps/server-rdma-monitor/Dockerfile
  #   container_name: align-rdma-monitor
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=development
  #     - SUPABASE_URL=${SUPABASE_URL}
  #     - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
  #   volumes:
  #     - ./apps/server-rdma-monitor:/app
  #     - /app/node_modules
  #   networks:
  #     - align-network
  

  # ============================================
  # Web Regulator (Next.js Kill Switch Admin UI)
  # ============================================
  web-regulator:
    build:
      context: .
      dockerfile: apps/web-regulator/Dockerfile
    container_name: alygn-web-regulator
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - KILL_SWITCH_BACKEND_URL=http://alygn-kill-switch:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://alygn-kill-switch:3000}
      - NEXT_PUBLIC_BETTER_AUTH_URL=/api/auth
      - KILL_SWITCH_AUTH_TOKEN=${KILL_SWITCH_AUTH_TOKEN}
      - NEXT_PUBLIC_OTEL_ENABLED=false
    networks:
      - align-network
    depends_on:
      kill-switch:
        condition: service_healthy

  # ============================================
