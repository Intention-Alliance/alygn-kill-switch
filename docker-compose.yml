version: '3.8'

services:
  # ============================================
  # Telemetry Handler (C++)
  # ============================================
  telemetry-handler:
    build:
      context: .
      dockerfile: ./apps/server-telemetry-handler/Dockerfile
    container_name: align-telemetry-handler
    restart: unless-stopped
    environment:
      - DPU_ID=${DPU_ID:-dpu-node-001}
      - DPU_SLUG=${DPU_SLUG:-austin-primary}
      - BATCH_SIZE=${BATCH_SIZE:-50}
      - FLUSH_INTERVAL_MS=${FLUSH_INTERVAL_MS:-3000}
      - ENABLE_ZKP=${ENABLE_ZKP:-true}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_DEBUG=${ENABLE_DEBUG:-false}
    ports:
      - "127.0.0.1:3002:3002"
    networks:
      - align-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # depends_on:
    #   - slashing-engine
    #   - rdma-monitor
  
  # ============================================
  # Ollama Proxy — bridges align-network to host Ollama
  # ============================================
  ollama-proxy:
    image: alpine/socat
    container_name: alygn-ollama-proxy
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:172.17.0.1:11434
    networks:
      - align-network
      - default
    restart: unless-stopped

  # ============================================
  # Kill Switch API (Bun + Elysia + SQLite)
  # ============================================
  kill-switch:
    build:
      context: .
      dockerfile: apps/server-kill-switch/Dockerfile
    container_name: alygn-kill-switch
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    pid: "host"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kill-switch-data:/app/data
      - ${SECRETS_FILE:-/home/andlersrv/.openclaw/secrets.json}:/root/.openclaw/secrets.json:ro
      - /proc:/host/proc:ro
      - /run/log/journal:/run/log/journal:ro
      - /:/host-root:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - KILL_SWITCH_ENV=${KILL_SWITCH_ENV:-production}
      - KILL_SWITCH_PORT=3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - KILL_SWITCH_AUTH_TOKEN=${KILL_SWITCH_AUTH_TOKEN:?KILL_SWITCH_AUTH_TOKEN required}
      - KILL_SWITCH_API_KEY=${KILL_SWITCH_API_KEY:?KILL_SWITCH_API_KEY required}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@alygn.com}
      # Bridge mode: the kill-switch reaches Redis via the align-network
      # service hostnames (redis-node-1, etc.) which resolve within the
      # bridge network. Published host ports (127.0.0.1:6380-6382) remain for
      # host-side tooling.
      - REDIS_URLS=${REDIS_URLS:-redis://redis:6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # nodeAddressMap for createCluster — maps announced internal Docker
      # hostnames to reachable addresses. Values must be {host, port} objects
      # (redis/client v4.7.1 NodeAddressMap shape). Overridable via env.
      - DATA_DIR=/app/data
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Inference verification layer — the kill-switch reaches Ollama on the
      # host via the host-gateway alias (host.docker.internal:11434).
      # P1-2: default ON (:-true) — the safety property (verify-before-trust)
      # must be active by default. The deploy host .env sets
      # KILL_SWITCH_VERIFY_ENABLED=true explicitly; an empty/absent host var
      # now defaults to true instead of silently disabling verification.
      - KILL_SWITCH_VERIFY_ENABLED=${KILL_SWITCH_VERIFY_ENABLED:-true}
      - KILL_SWITCH_VERIFY_MODE=${KILL_SWITCH_VERIFY_MODE:-async}
      - KILL_SWITCH_VERIFIER_MODEL=${KILL_SWITCH_VERIFIER_MODEL:-qwen2.5:0.5b}
      - KILL_SWITCH_VERIFIER_BASE_URL=${KILL_SWITCH_VERIFIER_BASE_URL:-http://alygn-ollama-proxy:11434}
      - KILL_SWITCH_VERIFIER_TIMEOUT_MS=${KILL_SWITCH_VERIFIER_TIMEOUT_MS:-500}
      # Ollama reverse-proxy (infra consult #3 — 2026-08-27): ordered,
      # comma-separated upstream list (first = primary, rest = failover).
      # Default is the container-network socat relay (alygn-ollama-proxy →
      # host Ollama at 172.17.0.1:11434). Read timeout matches nginx
      # proxy_read_timeout (90 min) so long generations are not cut short.
      - KILL_SWITCH_OLLAMA_UPSTREAMS=${KILL_SWITCH_OLLAMA_UPSTREAMS:-http://alygn-ollama-proxy:11434}
      - KILL_SWITCH_OLLAMA_PROXY_TIMEOUT_MS=${KILL_SWITCH_OLLAMA_PROXY_TIMEOUT_MS:-5400000}
      # ADR-136: WebAuthn (FIDO2) relying party — production Tailscale mesh
      # hostname + Nginx SSL listener. Overrides the schema defaults.
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-andlersrv.tail62d797.ts.net}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-https://andlersrv.tail62d797.ts.net:8443}
    networks:
      - align-network
      - infra-align-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # RDMA Monitor
  # ============================================
  # rdma-monitor:
  #   build:
  #     context: ./apps/server-rdma-monitor
  #     dockerfile: ./apps/server-rdma-monitor/Dockerfile
  #   container_name: align-rdma-monitor
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=development
  #     - SUPABASE_URL=${SUPABASE_URL}
  #     - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
  #   volumes:
  #     - ./apps/server-rdma-monitor:/app
  #     - /app/node_modules
  #   networks:
  #     - align-network
  

  # ============================================
  # Redis Cluster (3 nodes, kill-switch pubsub, rate-limit, cache)
  # Conf files: infra/redis/conf/node-{1,2,3}.conf
  # Cluster client discovers all 3 via cluster-announce-ip once bootstrapped
  # ============================================
  redis-node-1:
    image: redis:7-alpine
    container_name: align-redis-node-1
    command: ["redis-server", "/usr/local/etc/redis/node-1.conf"]
    volumes:
      - ./infra/redis/conf:/usr/local/etc/redis:ro
      - redis-node-1-data:/data
    networks:
      align-network:
        aliases:
          - redis
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:16380:16379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-node-2:
    image: redis:7-alpine
    container_name: align-redis-node-2
    command: ["redis-server", "/usr/local/etc/redis/node-2.conf"]
    volumes:
      - ./infra/redis/conf:/usr/local/etc/redis:ro
      - redis-node-2-data:/data
    networks:
      - align-network
    # Published host port so host-side tooling can reach this node at
    # 127.0.0.1:6381. The kill-switch (bridge mode) reaches it via the
    # align-network hostname redis-node-2:6379. Cluster bootstrap still uses
    # internal hostnames within align-network — unaffected.
    ports:
      - "127.0.0.1:6381:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis-node-3:
    image: redis:7-alpine
    container_name: align-redis-node-3
    command: ["redis-server", "/usr/local/etc/redis/node-3.conf"]
    volumes:
      - ./infra/redis/conf:/usr/local/etc/redis:ro
      - redis-node-3-data:/data
    networks:
      - align-network
    # Published host port so host-side tooling can reach this node at
    # 127.0.0.1:6382. Cluster bootstrap still uses internal hostnames
    # (redis-node-3:6379) within align-network — unaffected.
    ports:
      - "127.0.0.1:6382:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # One-shot cluster bootstrap. Waits for all 3 nodes healthy, then
  # `redis-cli --cluster create` joins them and assigns 16384 slots.
  # Exits 0 on success; restart: "no" so it doesn't loop on failure.
  redis-cluster-init:
    image: redis:7-alpine
    container_name: align-redis-cluster-init
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[cluster-init] bootstrapping 3-node cluster..." &&
        redis-cli --cluster create \
          redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 \
          --cluster-replicas 0 --cluster-yes &&
        echo "[cluster-init] done"
    networks:
      - align-network
    restart: "no"

  # ============================================
  # Web Regulator (Next.js Kill Switch Admin UI)
  # ============================================
  web-regulator:
    build:
      context: .
      dockerfile: apps/web-regulator/Dockerfile
    container_name: alygn-web-regulator
    restart: unless-stopped
    # network_mode: host — the web-regulator needs direct host network access
    # to reach the kill-switch (localhost:3000) and Ollama (localhost:11434).
    # Docker bridge networking blocks host-bound ports despite extra_hosts.
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - KILL_SWITCH_BACKEND_URL=http://localhost:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_BETTER_AUTH_URL=/api/auth
      - KILL_SWITCH_AUTH_TOKEN=${KILL_SWITCH_AUTH_TOKEN}
      - NEXT_PUBLIC_OTEL_ENABLED=false
    depends_on:
      kill-switch:
        condition: service_healthy

  # ============================================
  # PostgreSQL (Local Development)
  # ============================================
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: align-postgres
  #   restart: unless-stopped
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=postgres
  #     - POSTGRES_DB=align_ledger
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./packages/db-schema/supabase/migrations:/docker-entrypoint-initdb.d:ro
  #   networks:
  #     - align-network

networks:
  align-network:
    name: infrastructure_align-network
    external: true
  phase0-net:
    external: true
  infra-align-network:
    name: infrastructure_align-network
    external: true

volumes:
  kill-switch-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
#   postgres_data:
