version: '3.8'

services:
  # ============================================
  # Slashing Engine (Node.js/Express)
  # ============================================
  slashing-engine:
    build:
      context: ./apps/server-slashing-engine
      dockerfile: Dockerfile.dev
    container_name: align-slashing-engine
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - ./apps/server-slashing-engine:/app
      - /app/node_modules
    networks:
      - align-network

  # ============================================
  # Telemetry Handler (C++)
  # ============================================
  telemetry-handler:
    build:
      context: ./apps/server-telemetry-handler
      dockerfile: Dockerfile
    container_name: align-telemetry-handler
    restart: unless-stopped
    environment:
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - DPU_ID=dpu-local-001
      - BATCH_SIZE=50
      - FLUSH_INTERVAL_MS=3000
      - ENABLE_ZKP=true
      - ENABLE_METRICS=true
    networks:
      - align-network
    depends_on:
      - slashing-engine

  # ============================================
  # Web Regulator (Next.js)
  # ============================================
  web-regulator:
    build:
      context: ./apps/web-regulator
      dockerfile: Dockerfile
    container_name: align-web-regulator
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./apps/web-regulator:/app
      - /app/node_modules
      - /app/.next
    networks:
      - align-network

  # ============================================
  # PostgreSQL (Local Development)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: align-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=align_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db-schema/supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - align-network

networks:
  align-network:
    driver: bridge

volumes:
  postgres_data:
