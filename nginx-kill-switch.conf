# ALYGN Kill Switch - Nginx Configuration
# Frontend: Next.js (port 3001)
# Backend: Bun + Elysia (port 3000)

upstream web-regulator {
    server 127.0.0.1:3001;
}

upstream kill-switch-api {
    server 127.0.0.1:3000;
}

server {
    listen 8443 ssl http2;
    server_name andlersrv.tail62d797.ts.net;

    # SSL Configuration (reuse existing certs)
    ssl_certificate /etc/letsencrypt/live/andlersrv.tail62d797.ts.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/andlersrv.tail62d797.ts.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Access logs
    access_log /var/log/nginx/alygn-kill-switch-access.log;
    error_log /var/log/nginx/alygn-kill-switch-error.log;

    # Frontend: Next.js (web-regulator)
    location / {
        proxy_pass http://web-regulator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Backend API: Auth routes (proxied through Next.js rewrites)
    # Next.js handles /api/auth/* → http://localhost:3000/v1/auth/*
    
    # Direct backend access (for health checks, internal services)
    location /v1/ {
        proxy_pass http://kill-switch-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Health check endpoint (public)
    location = /health {
        proxy_pass http://kill-switch-api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
